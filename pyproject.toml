[project]
name = "sonomos-firewall"
version = "0.3.5"
description = "Sonomos AI Firewall"
requires-python = ">= 3.10,<4"
readme = "README.md"
dependencies = [
    "pydantic>=2.9.2, <3.0.0",
    "requests>=2.32.3,<3",
    "nltk>=3.9.1,<4",
    "Pillow>=10.1.0,<11",
    "beautifulsoup4>=4.12.3,<5",
    "diskcache>=5.6.3,<6",
    "pexpect>=4.9.0,<5",
    "lark>=1.1.9",
    "termcolor>=2.4.0",
    "pip>=24.0",
    "pytest>=8.2.1",
    "pytesseract>=0.3.13",
    "aiohttp>=3.11.11",
    "rich>=13.5.3",
]

[project.scripts]
sonomos-firewall = "sonomos_firewall.__main__:main"

[dependency-groups]
dev = [
    "pytest-cov>=5.0.0,<6",
]

[project.optional-dependencies]
extras = [
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7.5",
    "semgrep>=1.78.0",
    "transformers>=4.41.1",
    "torch>=2.3.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
]

[tool.hatch.build.targets.sdist]
include = ["./sonomos_firewall"]

[tool.hatch.build.targets.wheel]
include = ["./sonomos_firewall"]

[tool.hatch.build.targets.wheel.sources]
"./sonomos_firewall" = "sonomos_firewall"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["sonomos_firewall/tests"]
pythonpath = ["."]
